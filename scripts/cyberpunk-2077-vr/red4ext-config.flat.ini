# RED4ext config for FLAT launches (copied over red4ext\config.ini by _vr\cp77-launch.cmd).
# TOML despite the extension. The plugin system is off: nothing in red4ext\plugins loads
# (the VR port, ArchiveXL, TweakXL, Codeware), so the game runs stock.
version = 0

[logging]
level = "info"
flush_on = "info"
max_files = 5
max_file_size = 10

[plugins]
enabled = false
ignored = [ "cyberpunkvrport" ]

[dev]
console = false
wait_for_debugger = false
