# RED4ext config for FLAT launches (copied over red4ext\config.ini by _vr\cp77-launch.cmd).
# TOML despite the extension. The VR plugin is skipped; any other RED4ext plugin still loads.
version = 0

[logging]
level = "info"
flush_on = "info"
max_files = 5
max_file_size = 10

[plugins]
enabled = true
ignored = [ "cyberpunkvrport" ]

[dev]
console = false
wait_for_debugger = false
