# RED4ext config for VR launches (copied over red4ext\config.ini by _vr\cp77-launch.cmd).
# TOML despite the extension. All plugins load, including cyberpunkvrport.
version = 0

[logging]
level = "info"
flush_on = "info"
max_files = 5
max_file_size = 10

[plugins]
enabled = true
ignored = []

[dev]
console = false
wait_for_debugger = false
